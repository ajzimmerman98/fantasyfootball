# Runs the app and Worker tests on every pull request and every push to main.
# Everything outside the app (Sleeper, FantasyPros, FantasyCalc, ESPN, weather) is answered from tests/fixtures, so no network or secrets are needed.
name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
